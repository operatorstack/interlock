# GoReleaser builds the prebuilt Interlock binaries attached to each GitHub
# Release. Interlock is pure Go / CGO-free / zero-dependency, so cross-compiling
# the five supported targets is a plain matrix build. The release workflow
# (labkit-generated .github/workflows/release.yml) tags a version, then runs
# `goreleaser release --clean` from that tag; GoReleaser produces the archives,
# checksums, and SBOMs and creates the Release. Build provenance is attested by
# the workflow after this runs.
#
# Local check: `goreleaser check` (config only) or `goreleaser release --snapshot
# --clean` (full dry run into ./dist, no publish).
version: 2

project_name: interlock

builds:
  - id: interlock
    main: ./cmd/interlock
    binary: interlock
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Version identity is stamped into package main (see cmd/interlock/version.go),
    # matching GoReleaser's default variable names.
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # The spec ships Windows amd64 only; drop windows/arm64 to land on exactly the
    # five supported targets (darwin arm64/amd64, linux amd64/arm64, windows amd64).
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: interlock
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One CycloneDX SBOM per archive, generated by syft (installed by the workflow).
sboms:
  - id: archive
    artifacts: archive

# Binaries are published to GCP Artifact Registry (the generic `dist` repo) by the
# release workflow (gcloud artifacts generic upload), fronted by get.operatorstack.systems.
# GoReleaser only builds + checksums + SBOMs; it does NOT create a GitHub Release.
release:
  disable: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew formula generation is wired but DISABLED until the tap exists.
# To enable (follow-up): create the operatorstack/homebrew-tap repository and a
# HOMEBREW_TAP_TOKEN secret, then uncomment this block and pass the token to the
# goreleaser step in the release workflow. No other change is required.
#
# brews:
#   - name: interlock
#     repository:
#       owner: operatorstack
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
#     homepage: "https://github.com/operatorstack/interlock"
#     description: "Code-defined effect-policy runtime for coding agents"
#     license: "Apache-2.0"
#     test: |
#       system "#{bin}/interlock", "version"
